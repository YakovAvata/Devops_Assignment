apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.metadata.name }}-service
spec:
  selector:
    app: {{ .Values.labels.app }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
  type: {{ .Values.service.type }}
  externalIPs:
    - 10.0.2.15