apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-deployment
  labels:
    app: my-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
        - name: backend-app
          image: backend-app:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "sleep 30 && node index.js"]
          ports:
            - containerPort: 3000
          env:
            - name: MONGODB_URL
              value: "mongodb://localhost:27017"