apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-deployment
  labels:
    app: my-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: mongodb
          image: mongo:6.0
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db

        - name: backend-app
          image: backend-app:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "sleep 30 && node index.js"]
          ports:
            - containerPort: 3000
          env:
            - name: MONGODB_URL
              value: "mongodb://localhost:27017"

        - name: frontend-app
          image: frontend-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80

      volumes:
        - name: mongo-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: my-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80



---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: my-app
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30380
  type: NodePort
  externalIPs:
    - 10.0.2.15

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-service
spec:
  # ingressClassName is necessary since v1.22
  ingressClassName: nginx
  tls:
  - hosts:
    - nice-assignment.local
    secretName: my-tls-secret
  rules:
  - host: nice-assignment.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80